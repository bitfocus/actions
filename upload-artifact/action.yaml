name: Upload artifact to BF S3
description: Uploads the artifact to the BF S3 server with a unique path based on the run ID.
inputs:
  artifact:
    description: "The artifact to upload"
    required: true
  artifact-filename:
    description: "Target filename in s3"
    required: true
    default: ""
  s3-host:
    description: "Server endpoint"
    required: true
    default: "s4.bitfocus.io"
  s3-bucket:
    description: "Bucket to upload to"
    required: true
    default: ""
  s3-access-key:
    description: "Access Key"
    required: true
    default: ""
  s3-secret-key:
    description: "Secret Key"
    required: true
    default: ""
  run-id:
    description: "The job id"
    required: true
outputs:
  artifact-url:
    description: "URL to artifact"
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: "composite"
  steps:
    - name: Download rclone client
      uses: bitfocus/actions/download-rclone@no-minio

    - name: Upload
      id: upload
      shell: bash
      env:
        SOURCE_FILENAME: ${{ inputs.artifact }}
        ARTIFACT_FILENAME: ${{ inputs.artifact-filename }}
        RUN_ID: ${{ inputs.run-id }}
        S3_HOST_INPUT: ${{ inputs.s3-host }}
        S3_BUCKET: ${{ inputs.s3-bucket }}
        S3_ACCESS_KEY: ${{ inputs.s3-access-key }}
        S3_SECRET_KEY: ${{ inputs.s3-secret-key }}
      run: |
        set -euo pipefail
        S3_HOST="$S3_HOST_INPUT"
        [[ "$S3_HOST" != https://* ]] && S3_HOST="https://${S3_HOST}"
        export RCLONE_CONFIG_REMOTE_TYPE="s3"
        export RCLONE_CONFIG_REMOTE_PROVIDER="Other"
        export RCLONE_CONFIG_REMOTE_ENV_AUTH="false"
        export RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID="$S3_ACCESS_KEY"
        export RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY="$S3_SECRET_KEY"
        export RCLONE_CONFIG_REMOTE_ENDPOINT="$S3_HOST"
        export RCLONE_CONFIG_REMOTE_REGION="eu-north-1"
        FILE_SIZE=$(wc -c < "$SOURCE_FILENAME" | tr -d '[:space:]')
        # rcat writes one remote object, like S3 PutObject.
        ./rclone rcat "remote:${S3_BUCKET}/${RUN_ID}/${ARTIFACT_FILENAME}" \
          --size "$FILE_SIZE" --s3-no-head --s3-no-check-bucket < "$SOURCE_FILENAME"
        echo "artifact-url=${S3_HOST}/${S3_BUCKET}/${RUN_ID}/${ARTIFACT_FILENAME}" >> "$GITHUB_OUTPUT"
        echo "Uploaded artifact to ${S3_HOST}/${S3_BUCKET}/${RUN_ID}/${ARTIFACT_FILENAME}"
