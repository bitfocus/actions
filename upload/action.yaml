# Most actions on github are either docker actions, or only for linux.
name: Upload BF S3
description: Uploads the file to the BF S3 server
inputs:
  filename:
    description: "The file to upload"
    required: true
  destination-filename:
    description: "Target filename in s3"
    required: true
    default: ""
  s3-host:
    description: "Server endpoint"
    required: true
    default: "s4.bitfocus.io"
  s3-region:
    description: "S3 region"
    required: false
    default: "eu-north-1"
  s3-bucket:
    description: "Bucket to upload to"
    required: true
    default: ""
  s3-access-key:
    description: "Access Key"
    required: true
    default: ""
  s3-secret-key:
    description: "Secret Key"
    required: true
    default: ""
outputs:
  url:
    description: "URL to uploaded file"
    value: ${{ steps.upload.outputs.url }}

runs:
  using: "composite"
  steps:
    - name: Download rclone client
      uses: $/download-rclone

    - name: Upload
      id: upload
      shell: bash
      env:
        SOURCE_FILENAME: ${{ inputs.filename }}
        DESTINATION_FILENAME: ${{ inputs.destination-filename }}
        S3_HOST_INPUT: ${{ inputs.s3-host }}
        S3_REGION: ${{ inputs.s3-region }}
        S3_BUCKET: ${{ inputs.s3-bucket }}
        S3_ACCESS_KEY: ${{ inputs.s3-access-key }}
        S3_SECRET_KEY: ${{ inputs.s3-secret-key }}
      run: |
        set -euo pipefail
        S3_HOST="$S3_HOST_INPUT"
        [[ "$S3_HOST" != https://* ]] && S3_HOST="https://${S3_HOST}"
        echo "Upload file to ${S3_HOST}/${S3_BUCKET}${DESTINATION_FILENAME}"
        export RCLONE_CONFIG_REMOTE_TYPE="s3"
        export RCLONE_CONFIG_REMOTE_PROVIDER="Other"
        export RCLONE_CONFIG_REMOTE_ENV_AUTH="false"
        export RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID="$S3_ACCESS_KEY"
        export RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY="$S3_SECRET_KEY"
        export RCLONE_CONFIG_REMOTE_ENDPOINT="$S3_HOST"
        export RCLONE_CONFIG_REMOTE_REGION="$S3_REGION"
        FILE_SIZE=$(wc -c < "$SOURCE_FILENAME" | tr -d '[:space:]')
        # rcat writes one remote object, like S3 PutObject.
        ./rclone rcat "remote:${S3_BUCKET}/${DESTINATION_FILENAME}" \
          --size "$FILE_SIZE" --s3-no-head --s3-no-check-bucket < "$SOURCE_FILENAME"
        echo "url=${S3_HOST}/${S3_BUCKET}/${DESTINATION_FILENAME}" >> "$GITHUB_OUTPUT"
