name: "Upload build and notify BitFocus API Server"
description: "Upload build and notify BitFocus API Server"
inputs:
  source-filename:
    description: "File to upload"
    required: true
    default: ""
  destination-filename:
    description: "Target filename in s3"
    required: true
    default: ""
  s3-host:
    description: "Server endpoint"
    required: true
    default: "s4.bitfocus.io"
  s3-region:
    description: "S3 region"
    required: false
    default: "eu-north-1"
  s3-bucket:
    description: "Bucket to upload to"
    required: true
    default: ""
  s3-access-key:
    description: "Access Key"
    required: true
    default: ""
  s3-secret-key:
    description: "Secret Key"
    required: true
    default: ""

  api-version:
    description: "Version number to report to api server (eg 1.0.0+1234-abcdefg)"
    required: true
    default: ""
  api-branch:
    description: "Name of branch to report to api server"
    required: false
    default: ""
  api-product:
    description: "Name of the product"
    required: true
    default: ""
  api-target:
    description: "Build target (linux-img/linux-deb/linux-tgz/mac-intel/mac-arm/win-x86/win-x64)"
    required: true
    default: ""
  api-secret:
    description: "Secret for the api server"
    required: true
    default: ""
  public-bucket-url:
    description: "URL prefix for the uploaded file (action appends the sanitized destination-filename)"
    required: false
    default: ""
outputs:
  upload-url:
    description: "The URL of the uploaded file as reported to the API server"
    value: ${{ steps.notify.outputs.upload-url }}
runs:
  using: "composite"
  steps:
    - name: Download rclone client
      uses: bitfocus/actions/download-rclone@no-minio

    - name: Sanitize filenames
      id: sanitize
      shell: bash
      run: |
        # Replace + with - to avoid URL encoding issues (CloudFront treats + as a space)
        DEST="${{ inputs.destination-filename }}"
        echo "destination-filename=${DEST//+/-}" >> "$GITHUB_OUTPUT"

    - name: Upload file
      shell: bash
      env:
        SOURCE_FILENAME: ${{ inputs.source-filename }}
        DESTINATION_FILENAME: ${{ steps.sanitize.outputs.destination-filename }}
        S3_HOST_INPUT: ${{ inputs.s3-host }}
        S3_REGION: ${{ inputs.s3-region }}
        S3_BUCKET: ${{ inputs.s3-bucket }}
        S3_ACCESS_KEY: ${{ inputs.s3-access-key }}
        S3_SECRET_KEY: ${{ inputs.s3-secret-key }}
      run: |
        set -euo pipefail
        S3_HOST="$S3_HOST_INPUT"
        [[ "$S3_HOST" != https://* ]] && S3_HOST="https://${S3_HOST}"

        export RCLONE_CONFIG_REMOTE_TYPE="s3"
        export RCLONE_CONFIG_REMOTE_PROVIDER="Other"
        export RCLONE_CONFIG_REMOTE_ENV_AUTH="false"
        export RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID="$S3_ACCESS_KEY"
        export RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY="$S3_SECRET_KEY"
        export RCLONE_CONFIG_REMOTE_ENDPOINT="$S3_HOST"
        export RCLONE_CONFIG_REMOTE_REGION="$S3_REGION"
        FILE_SIZE=$(wc -c < "$SOURCE_FILENAME" | tr -d '[:space:]')
        # rcat writes one remote object, like S3 PutObject.
        ./rclone rcat "remote:${S3_BUCKET}/${DESTINATION_FILENAME}" \
          --size "$FILE_SIZE" --s3-no-head --s3-no-check-bucket < "$SOURCE_FILENAME"

    - name: Notify API Server
      id: notify
      shell: bash
      env:
        SOURCE_FILENAME: ${{ inputs.source-filename }}
      run: |
        # This seems like the most portable way we can do this
        if ${{ runner.os == 'macOS' }}; then
          SHA512=$(openssl dgst -sha512 -binary "$SOURCE_FILENAME" | base64)
        else
          SHA512=$(openssl dgst -sha512 -binary "$SOURCE_FILENAME" | base64 -w 0)
        fi

        # Use rclone and jq for this as we know both will be available
        SIZE=$(./rclone size --json "$SOURCE_FILENAME" | jq -r .bytes)

        UPLOAD_URL_PREFIX="${{ inputs.public-bucket-url }}"
        if [[ -n "$UPLOAD_URL_PREFIX" ]]; then
          UPLOAD_URL="${UPLOAD_URL_PREFIX}/${{ steps.sanitize.outputs.destination-filename }}"
        else
          S3_HOST="${{ inputs.s3-host }}"
          [[ "$S3_HOST" != https://* ]] && S3_HOST="https://${S3_HOST}"
          UPLOAD_URL="${S3_HOST}/${{ inputs.s3-bucket }}/${{ steps.sanitize.outputs.destination-filename }}"
        fi
        echo "upload-url=${UPLOAD_URL}" >> "$GITHUB_OUTPUT"

        curl -X 'POST' \
          'https://api.bitfocus.io/v1/product/${{ inputs.api-product }}/package' \
          -H 'accept: application/json' \
          -H 'Content-Type: application/json' \
          -d '{
          "branch": "${{ inputs.api-branch }}",
          "version": "${{ inputs.api-version }}",
          "target": "${{ inputs.api-target }}",
          "filename": "${{ inputs.destination-filename }}",
          "filesize": "'${SIZE}'",
          "filesha512": "'${SHA512}'",
          "url": "'${UPLOAD_URL}'",
          "secret": "${{ inputs.api-secret }}"
        }'
